<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pivot Scout Painel</title>
  <meta name="description" content="Painel com os pontos de pivot capturados pelos operadores.">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="vendor/leaflet/leaflet.css">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="panel">
  <header class="topbar">
    <div class="brand"><img src="icons/icon.svg" alt="" width="30" height="30"><span>Pivot Scout</span><span id="who" class="badge brand" hidden></span></div>
    <div class="topbar-actions">
      <button id="notify-btn" class="btn-primary small" type="button" hidden></button>
      <button id="sound-btn" class="icon-btn" type="button" aria-pressed="true"><svg class="i"><use href="icons/sprite.svg#volume"/></svg></button>
      <a id="admin-link" class="icon-btn" href="admin.html" hidden data-i18n-title="panel.admin"><svg class="i"><use href="icons/sprite.svg#shield"/></svg></a>
      <button id="refresh" class="icon-btn" type="button" hidden data-i18n-title="panel.refresh"><svg class="i"><use href="icons/sprite.svg#refresh"/></svg></button>
      <button id="lang" class="btn-ghost small" type="button">EN</button>
      <button id="logout" class="icon-btn" type="button" hidden data-i18n-title="act.logout"><svg class="i"><use href="icons/sprite.svg#logout"/></svg></button>
    </div>
  </header>

  <main>
    <section id="login" class="panel-login" hidden>
      <div class="card reveal">
        <h1 data-i18n="login.title">Entrar</h1>
        <p class="muted" data-i18n="login.leadPanel"></p>
        <form id="login-form" autocomplete="off">
          <label for="code" data-i18n="login.codeOrPass">Código da equipe ou senha de admin</label>
          <input id="code" type="password" spellcheck="false" required>
          <p id="login-err" class="error" role="alert"></p>
          <button class="btn-primary big" type="submit" data-i18n="login.submit">Entrar</button>
        </form>
      </div>
    </section>

    <section id="app" hidden>
      <div class="toolbar">
        <div class="search">
          <svg class="i"><use href="icons/sprite.svg#search"/></svg>
          <input id="search" type="search" data-i18n-ph="panel.search">
        </div>
        <span id="count" class="muted small-text"></span>
        <span id="live" class="live idle" role="status"><span class="live-dot" aria-hidden="true"></span><span id="live-text"></span></span>
        <select id="auto" class="small-select" aria-label="Atualização automática" data-i18n-title="live.every">
          <option value="10">10 s</option>
          <option value="15">15 s</option>
          <option value="30">30 s</option>
          <option value="60">1 min</option>
          <option value="0" data-i18n="live.off">Desligado</option>
        </select>
        <span class="spacer"></span>
        <button id="farms-btn" class="btn small" type="button"><svg class="i"><use href="icons/sprite.svg#layers"/></svg><span data-i18n="farm.title">Fazendas</span><span id="farms-count" class="badge info">0</span></button>
        <button id="export-kml" class="btn small" type="button"><svg class="i"><use href="icons/sprite.svg#download"/></svg><span data-i18n="panel.exportKml">KML</span></button>
        <button id="export-geo" class="btn small" type="button"><svg class="i"><use href="icons/sprite.svg#download"/></svg><span data-i18n="panel.exportGeo">GeoJSON</span></button>
      </div>
      <div class="panel-grid">
        <div id="map"></div>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th style="width:32px"><input id="select-all" type="checkbox" aria-label="Selecionar todos"></th>
                <th data-i18n="panel.colName">Pivot</th>
                <th data-i18n="panel.colCoord">Lat, long</th>
                <th data-i18n="panel.colFarm">Fazenda</th>
                <th data-i18n="panel.colAcc">Precisão</th>
                <th data-i18n="panel.colDate">Capturado</th>
                <th data-i18n="panel.colExpiry">Apaga em</th>
                <th></th>
              </tr>
            </thead>
            <tbody id="rows"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <dialog id="edit-dialog">
    <form id="edit-form" method="dialog">
      <div class="dialog-head"><h2 data-i18n="edit.title">Editar ponto</h2></div>
      <label for="edit-name" data-i18n="save.name">Nome do pivot</label>
      <input id="edit-name" type="text" required maxlength="120">
      <div class="row">
        <div class="grow"><label for="edit-lat">Lat</label><input id="edit-lat" type="text" inputmode="decimal" required></div>
        <div class="grow"><label for="edit-lng">Long</label><input id="edit-lng" type="text" inputmode="decimal" required></div>
      </div>
      <p id="edit-err" class="error" role="alert"></p>
      <div class="row">
        <button id="edit-cancel" class="btn-ghost" type="button" data-i18n="edit.cancel">Cancelar</button>
        <button class="btn-primary" type="submit" data-i18n="edit.save">Salvar</button>
      </div>
    </form>
  </dialog>

  <dialog id="farm-dialog">
    <div class="dialog-head"><h2 data-i18n="farm.title">Fazendas</h2><button id="farm-x" class="icon-btn" type="button" aria-label="Fechar"><svg class="i"><use href="icons/sprite.svg#x"/></svg></button></div>
    <p class="muted" data-i18n="farm.lead"></p>
    <input id="farm-file" class="file-hidden" type="file" accept=".kml,.kmz,application/vnd.google-earth.kml+xml,application/vnd.google-earth.kmz">
    <button id="farm-import" class="btn-primary" type="button" style="width:100%"><svg class="i"><use href="icons/sprite.svg#upload"/></svg><span data-i18n="farm.import">Importar KML / KMZ</span></button>
    <p id="farm-err" class="error" role="alert"></p>
    <ul id="farm-list" class="list"></ul>
    <div class="row"><button id="farm-close" class="btn" type="button">OK</button></div>
  </dialog>

  <dialog id="photo-dialog" class="photo">
    <img id="photo-img" alt="">
    <div class="row"><button id="photo-close" class="btn" type="button">OK</button></div>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>
  <script src="vendor/leaflet/leaflet.js"></script>
  <script type="module" src="js/painel.js"></script>
</body>
</html>
