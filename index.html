<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Pivot Scout</title>
  <meta name="description" content="Captura da coordenada da ponta externa do pivot para o PlaneView.">
  <meta name="theme-color" content="#0f5c3f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="app-capture">
  <header class="topbar">
    <div class="brand"><img src="icons/icon.svg" alt="" width="30" height="30"><span>Pivot Scout</span></div>
    <div class="topbar-actions">
      <span id="net" class="pill"></span>
      <button id="lang" class="btn-ghost small" type="button">EN</button>
    </div>
  </header>

  <main>
    <!-- Login -->
    <section id="login" class="welcome" hidden>
      <div class="welcome-mark reveal" aria-hidden="true">
        <svg viewBox="0 0 104 104">
          <circle cx="52" cy="52" r="48" fill="var(--brand-soft)"/>
          <circle cx="52" cy="52" r="40" fill="none" stroke="var(--brand)" stroke-width="2.5" stroke-dasharray="2 7" stroke-linecap="round" opacity="0.6"/>
          <g class="arm">
            <path d="M52 52 L52 12 A40 40 0 0 1 80.3 23.7 Z" fill="var(--brand)" opacity="0.14"/>
            <line x1="52" y1="52" x2="52" y2="12" stroke="var(--brand)" stroke-width="4" stroke-linecap="round"/>
            <circle cx="52" cy="12" r="6" fill="var(--accent)" stroke="var(--surface)" stroke-width="2.5"/>
          </g>
          <circle cx="52" cy="52" r="7" fill="var(--brand)"/>
        </svg>
      </div>
      <h1 class="reveal" style="--i:1" data-i18n="login.welcome">Pivot Scout</h1>
      <p class="lead reveal" style="--i:2" data-i18n="login.lead"></p>
      <form id="login-form" class="card reveal" style="--i:3" autocomplete="off">
        <label for="code" style="margin-top:0" data-i18n="login.code">Código da equipe</label>
        <input id="code" class="code" type="text" autocapitalize="characters" spellcheck="false" required placeholder="ABC-XXXXX-XXXXX">
        <label for="operator" data-i18n="login.operator">Seu nome (opcional)</label>
        <input id="operator" type="text" maxlength="40" autocomplete="name" data-i18n-ph="login.operatorPh">
        <p id="login-err" class="error" role="alert"></p>
        <button class="btn-primary big" type="submit" data-i18n="login.submit">Entrar</button>
      </form>
    </section>

    <!-- App -->
    <section id="app" hidden>
      <div class="card hero reveal">
        <div class="card-head">
          <span class="eyebrow" data-i18n="gps.title">Posição atual</span>
          <span id="gps-status" class="hero-status"></span>
        </div>
        <div id="acc" class="gauge none" role="meter" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-live="polite">
          <span class="gauge-sweep" aria-hidden="true"></span>
          <span class="gauge-ripple" aria-hidden="true"></span>
          <svg viewBox="0 0 120 120" aria-hidden="true">
            <circle class="gauge-ticks" cx="60" cy="60" r="59"></circle>
            <circle class="gauge-track" cx="60" cy="60" r="52"></circle>
            <circle class="gauge-arc" cx="60" cy="60" r="52"></circle>
          </svg>
          <div class="gauge-center">
            <span class="gauge-label" data-i18n="gps.accuracy">Precisão</span>
            <span class="gauge-value"><span id="acc-num">—</span><small> m</small></span>
            <span id="acc-level" class="gauge-level"></span>
          </div>
        </div>
        <div id="coords" class="coords" role="button" tabindex="0" data-i18n-title="act.clickCopy">
          <div><label>Lat <svg class="i"><use href="icons/sprite.svg#copy"/></svg></label><output id="lat">—</output></div>
          <div><label>Long <svg class="i"><use href="icons/sprite.svg#copy"/></svg></label><output id="lng">—</output></div>
        </div>
        <p class="hint" style="text-align:center;margin-bottom:0" data-i18n="gps.hint"></p>
      </div>

      <div class="points-head reveal" style="--i:1">
        <h2 data-i18n="list.title">Meus pontos</h2>
        <span id="sync-msg" class="muted small-text"></span>
      </div>
      <ul id="points" class="point-list"></ul>

      <footer class="foot">
        <span id="team-label" class="badge brand"></span>
        <a href="painel.html" data-i18n="act.panel">Painel do PC</a>
        <button id="logout" class="link" type="button" data-i18n="act.logout">Sair</button>
      </footer>
    </section>
  </main>

  <!-- Barra inferior -->
  <div id="dock" class="dock" hidden>
    <div class="dock-inner">
      <button id="sync-now" class="sync-chip" type="button" data-i18n-title="sync.now">
        <svg class="i"><use href="icons/sprite.svg#cloud-up"/></svg>
        <strong id="pending-count">0</strong>
      </button>
      <button id="capture" class="capture-btn" type="button" disabled>
        <span class="burst" aria-hidden="true"></span>
        <svg class="i"><use href="icons/sprite.svg#target"/></svg>
        <span data-i18n="gps.capture">Capturar ponta do pivot</span>
      </button>
    </div>
  </div>

  <!-- Folha para salvar o ponto -->
  <dialog id="sheet" class="sheet" aria-labelledby="sheet-title">
    <div class="sheet-grip" aria-hidden="true"></div>
    <form id="save-form" novalidate>
      <div class="dialog-head">
        <h2 id="sheet-title" data-i18n="save.title">Ponto capturado</h2>
        <button id="discard" class="icon-btn" type="button" data-i18n-title="save.discard"><svg class="i"><use href="icons/sprite.svg#x"/></svg></button>
      </div>
      <div class="capture-summary">
        <svg class="i"><use href="icons/sprite.svg#pin"/></svg>
        <div style="flex:1;min-width:0">
          <div id="cap-coord" class="mono"></div>
          <div class="muted small-text" data-i18n="save.outerEnd">Ponta externa do pivot</div>
        </div>
        <span id="cap-acc" class="badge">—</span>
      </div>

      <label for="name" data-i18n="save.name">Nome do pivot</label>
      <input id="name" type="text" required maxlength="120" enterkeyhint="done" data-i18n-ph="save.namePh">
      <p id="name-err" class="error" role="alert"></p>

      <label data-i18n="save.photo">Foto (opcional)</label>
      <input id="photo" class="file-hidden" type="file" accept="image/*" capture="environment">
      <div class="photo-slot">
        <button id="photo-btn" class="btn" type="button" style="flex:1"><svg class="i"><use href="icons/sprite.svg#camera"/></svg><span data-i18n="save.photoBtn">Tirar foto</span></button>
        <button id="photo-remove" class="icon-btn danger" type="button" hidden data-i18n-title="save.photoRemove"><svg class="i"><use href="icons/sprite.svg#trash"/></svg></button>
      </div>
      <img id="photo-preview" class="photo-preview" alt="" hidden>

      <button class="btn-primary big" type="submit"><svg class="i"><use href="icons/sprite.svg#check"/></svg><span data-i18n="save.save">Salvar ponto</span></button>
    </form>
  </dialog>

  <div id="flash" class="flash" aria-hidden="true"></div>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/capture.js"></script>
</body>
</html>
